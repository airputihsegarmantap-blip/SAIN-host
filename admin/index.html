<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin SAIN</title>
<style>
:root { --paper:#f7f2e8; --ink:#17432a; --green:#1b6233; --line:#e2d8c4; --accent:#cc9024; --muted:#5e6b5f; }
* { box-sizing: border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.5 system-ui, "Segoe UI", sans-serif; }
header { background:var(--green); color:#fff; padding:14px 20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
header b { font-size:18px; margin-right:auto; }
main { max-width:1200px; margin:0 auto; padding:20px 16px; }
input, button, select { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); }
button { background:var(--accent); border:0; font-weight:600; cursor:pointer; }
nav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
nav button { background:#fff; border:1px solid var(--line); }
nav button[aria-pressed=true] { background:var(--ink); color:#fff; }
.tbl { overflow-x:auto; background:#fff; border:1px solid var(--line); border-radius:12px; }
table { border-collapse:collapse; width:100%; min-width:700px; }
th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
th { background:#faf6ee; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
.muted { color:var(--muted); }
.err { color:#b3261e; }
img.th { width:56px; height:56px; object-fit:cover; border-radius:6px; margin:2px; }
</style>
</head>
<body>
<header><b>Admin SAIN</b>
  <form id="login"><input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="current-password"> <button>Masuk</button></form>
</header>
<main>
  <p id="msg" class="muted">Masukkan token admin untuk melihat data.</p>
  <nav id="tabs" hidden></nav>
  <div id="view"></div>
</main>
<script>
(function () {
  var token = sessionStorage.getItem("sainTok") || "", data = null, tab = "orders";
  var LABEL = { orders: "Pesanan", setoran: "Setoran preloved", komunitas: "Komunitas", mitra: "Mitra" };
  var STATUS = { orders: ["menunggu_pembayaran", "dibayar", "diproduksi", "dikirim", "selesai", "batal"], setoran: ["baru", "dikurasi", "diterima", "ditolak"], komunitas: ["baru", "dihubungi", "deal", "batal"], mitra: ["baru", "dihubungi", "lolos", "tidak_lolos"] };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function rp(n) { return "Rp" + Math.round(n || 0).toLocaleString("id-ID"); }
  function t(s) { return s ? new Date(s).toLocaleString("id-ID") : ""; }
  function req(url, opt) { opt = opt || {}; opt.headers = Object.assign({ Authorization: "Bearer " + token }, opt.headers || {}); return fetch(url, opt).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); }); }
  function load() {
    document.getElementById("msg").textContent = "Memuat…";
    req("/api/admin/data").then(function (d) { data = d; sessionStorage.setItem("sainTok", token); document.getElementById("msg").textContent = ""; render(); })
      .catch(function (e) { document.getElementById("msg").innerHTML = '<span class="err">' + esc(e.message) + '</span>'; });
  }
  function statusSel(col, id, cur) { return '<select data-col="' + col + '" data-id="' + esc(id) + '">' + STATUS[col].map(function (s) { return '<option' + (s === cur ? " selected" : "") + '>' + s + '</option>'; }).join("") + '</select>'; }
  function wa(n) { var d = String(n || "").replace(/^\+/, "").replace(/^0/, "62"); return '<a href="https://wa.me/' + esc(d) + '" target="_blank" rel="noopener">' + esc(n) + '</a>'; }
  function render() {
    var tabs = document.getElementById("tabs"); tabs.hidden = false;
    tabs.innerHTML = Object.keys(LABEL).map(function (k) { return '<button data-tab="' + k + '" aria-pressed="' + (k === tab) + '">' + LABEL[k] + ' (' + data[k].length + ')</button>'; }).join("") + '<button data-reload>Muat ulang</button>';
    var rows = data[tab].slice().reverse(), h = "";
    if (tab === "orders") h = '<tr><th>Pesanan</th><th>Pembeli</th><th>Item</th><th>Total</th><th>Status</th></tr>' + rows.map(function (o) {
      return '<tr><td><b>' + esc(o.order) + '</b><br><span class="muted">' + t(o.createdAt) + '<br>' + esc(o.courier.name) + ' · ' + esc(o.resi) + '</span></td>' +
        '<td>' + esc(o.buyer.nama) + '<br>' + wa(o.buyer.wa) + '<br>' + esc(o.buyer.email) + '<br><span class="muted">' + esc(o.buyer.alamat) + ', ' + esc(o.buyer.kota) + ', ' + esc(o.buyer.prov) + ' ' + esc(o.buyer.pos) + '</span></td>' +
        '<td>' + o.items.map(function (i) { return esc(i.qty + "× " + i.name + (i.size ? " (" + i.size + ")" : "")) + (i.cfg ? '<br><span class="muted">' + esc(i.cfg.title + " · " + i.cfg.colors.join(" ") + (i.cfg.note ? " · " + i.cfg.note : "")) + '</span>' : ""); }).join("<br>") + '</td>' +
        '<td>' + rp(o.total) + '<br><span class="muted">sedekah ' + rp(o.sedekah) + '</span></td><td>' + statusSel("orders", o.order, o.status) + '</td></tr>';
    }).join("");
    if (tab === "setoran") h = '<tr><th>ID</th><th>Jenis</th><th>Jumlah</th><th>Opsi</th><th>Foto</th><th>Status</th></tr>' + rows.map(function (s) {
      return '<tr><td><b>' + esc(s.id) + '</b><br><span class="muted">' + t(s.createdAt) + '</span></td><td>' + esc(s.jenis) + '</td><td>' + s.jumlah + '</td><td>' + esc(s.opsi) + '</td><td>' +
        s.foto.map(function (f) { var u = "/api/admin/uploads/" + encodeURIComponent(f) + "?token=" + encodeURIComponent(token); return '<a href="' + u + '" target="_blank"><img class="th" src="' + u + '" alt=""></a>'; }).join("") + '</td><td>' + statusSel("setoran", s.id, s.status) + '</td></tr>';
    }).join("");
    if (tab === "komunitas") h = '<tr><th>ID</th><th>Lembaga</th><th>Produk</th><th>Qty</th><th>Tanggal butuh</th><th>Catatan</th><th>Status</th></tr>' + rows.map(function (c) {
      return '<tr><td><b>' + esc(c.id) + '</b><br><span class="muted">' + t(c.createdAt) + '</span></td><td>' + esc(c.nama) + '</td><td>' + esc(c.produk) + '</td><td>' + c.qty + '</td><td>' + esc(c.tanggal || "-") + '</td><td>' + esc(c.catatan) + '</td><td>' + statusSel("komunitas", c.id, c.status) + '</td></tr>';
    }).join("");
    if (tab === "mitra") h = '<tr><th>ID</th><th>Jenis</th><th>Nama</th><th>WhatsApp</th><th>Kota</th><th>Status</th></tr>' + rows.map(function (m) {
      return '<tr><td><b>' + esc(m.id) + '</b><br><span class="muted">' + t(m.createdAt) + '</span></td><td>' + esc(m.jenis) + '</td><td>' + esc(m.nama) + '</td><td>' + wa(m.wa) + '</td><td>' + esc(m.kota) + '</td><td>' + statusSel("mitra", m.id, m.status) + '</td></tr>';
    }).join("");
    document.getElementById("view").innerHTML = rows.length ? '<div class="tbl"><table>' + h + '</table></div>' : '<p class="muted">Belum ada data.</p>';
  }
  document.getElementById("login").addEventListener("submit", function (e) { e.preventDefault(); token = document.getElementById("tok").value.trim(); load(); });
  document.addEventListener("click", function (e) { var b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; render(); } if (e.target.closest("[data-reload]")) load(); });
  document.addEventListener("change", function (e) {
    var s = e.target.closest("select[data-col]"); if (!s) return;
    req("/api/admin/" + s.dataset.col + "/" + encodeURIComponent(s.dataset.id), { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: s.value }) })
      .then(function () { var r = data[s.dataset.col].find(function (x) { return (x.order || x.id) === s.dataset.id; }); if (r) r.status = s.value; })
      .catch(function (er) { alert("Gagal: " + er.message); });
  });
  if (token) load();
})();
</script>
</body>
</html>
