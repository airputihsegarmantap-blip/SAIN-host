# Blueprint Render.com (paket gratis). Buka dashboard Render → New → Blueprint → pilih repo ini.
services:
  - type: web
    name: sain
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_TOKEN
        generateValue: true
